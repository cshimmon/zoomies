  line(c,x+w/2,y,x+w/2,y+h,'#fbfbf7',6); line(c,x,y+h/2,x+w,y+h/2,'#fbfbf7',5);
  if(curt){

    rr(c,x-26,y-16,26,h+34,4,curt); rr(c,x+w,y-16,26,h+34,4,curt);
  }
}
function sill(c,x,y,w){ rect(c,x,y,w,10,'#fbfbf7'); rect(c,x,y+10,w,3,'#d8d2c4'); }

}

let seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
function industrial(c,x,y,metal,s=1){

  line(c,x-40*s,y+40*s,x+40*s,y+40*s,metal,3); line(c,x-20*s,y+28*s,x+20*s,y+28*s,metal,3);
  for(const [bx,by] of [[-40,40],[40,40],[-20,28],[20,28],[0,40]]){
    line(c,x+bx*s,y+by*s,x+bx*s,y+by*s+10,metal,4);
    ell(c,x+bx*s,y+by*s+20,6,9,'#ffe9a8');
  }
}
function spotTrack(c,x1,x2,y){
  line(c,x1,y+6,x2,y+6,'#111',4);

}
function hex(c,cx,cy,r,col){ c.fillStyle=col; c.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; c.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)); } c.closePath(); c.fill(); }
function picFrame(c,x,y,w,h,inner){ rect(c,x,y,w,h,'#111'); rect(c,x+4,y+4,w-8,h-8,'#f4f4f0'); rect(c,x+12,y+12,w-24,h-24,inner); }
function blinds(c,x,y,w,h,col){ for(let j=y;j<y+h*0.55;j+=7) rect(c,x,j,w,4,col); }

  rect(c,20,508,1000,12,'#111'); rect(c,1040,508,900,12,'#111'); rect(c,1960,508,520,12,'#111'); rect(c,2500,508,900,12,'#f4f1ea');
  // roof + outer walls
  rect(c,0,0,3420,60,'#5b2f2a'); for(let i=0;i<3420;i+=40) for(let j=0;j<60;j+=20) rr(c,i+((j/20)%2)*20,j,38,18,3,'#6d3a33');
  rect(c,0,60,20,WH,'#8a4334'); for(let j=60;j<WH;j+=16) line(c,0,j,20,j,'#6e3326',2);

  ell(c,x,y+2,4,2.5,col); ell(c,x-4,y-2,1.6,1.4,col); ell(c,x,y-3,1.6,1.4,col); ell(c,x+4,y-2,1.6,1.4,col);
}

/* ---------------- Dog ---------------- */
function animDog(dt){
  if(P.earA===undefined){ P.earA=0.15; P.earV=0; P.squash=0; P.runPh=0; }
  const run=P.onGround?Math.min(1,Math.abs(P.vx)/RUN):0;
  if(P.onGround && run>0.05) P.runPh+=dt*(7+11*run); else if(P.onGround) P.runPh*=Math.pow(0.02,dt);
  let target=0.15+run*0.55;
  if(P.fuss) target=2.9+Math.sin(T*6)*0.25;
  else if(!P.onGround) target = P.vy>0 ? Math.min(2.6,0.4+P.vy/450) : -0.15+P.vy/3000;
  if(P.onGround && run<0.05 && Math.sin(T*0.9)>0.985) target+=0.5; // ear twitch
  P.earV+=(target-P.earA)*140*dt; P.earV*=Math.exp(-7*dt); P.earA+=P.earV*dt;
  P.squash+=(0-P.squash)*Math.min(1,dt*9);
}
function drawDog(c,t){
  const cx=P.x+P.w/2, by=P.y+P.h, f=P.facing;
  const run=P.onGround?Math.min(1,Math.abs(P.vx)/RUN):0, air=!P.onGround;
  const F='#5e3824', SH='#432617', LI='#7d4d33', OL='#1a0f09';
  const ph=P.runPh||0, sq=P.squash||0;
  c.save();
  c.translate(cx,by-P.h/2);
  if(P.spinT>0) c.rotate((1-P.spinT/0.42)*TAU*f);
  if(P.pound) c.rotate(0.35*f);
  if(P.fuss) c.rotate(Math.PI+Math.sin(t*5)*0.08);
  c.translate(0,P.h/2); c.scale(f,1);
  c.scale(1+sq*0.6,1-sq);
  const pitch = air ? Math.max(-0.32,Math.min(0.38,P.vy/2400)) : Math.sin(ph)*0.06*run;
  const bob = air ? 0 : -Math.abs(Math.sin(ph))*4*run;
  c.translate(0,bob); c.rotate(pitch);
  const wag=Math.sin(t*(P.fuss?28:run>0.2?22:air?26:10))*(air||P.fuss?0.45:0.32);
  // legs: [upper, lower] angles
  const gal=(o)=>Math.sin(ph+o);
  let fn,ff,bn,bf;
  if(P.fuss){ fn=[Math.sin(t*13)*0.7,Math.max(0,Math.sin(t*13+1))*1.2]; ff=[Math.sin(t*12+1.7)*0.7,Math.max(0,Math.sin(t*12+2.6))*1.2];
    bn=[Math.sin(t*11+0.5)*0.6,-Math.max(0,Math.sin(t*11+2))*1.1]; bf=[Math.sin(t*10+2.3)*0.6,-Math.max(0,Math.sin(t*10+3.1))*1.1]; }
  else if(P.pound){ fn=[-0.4,0.6]; ff=[-0.5,0.7]; bn=[0.5,-0.6]; bf=[0.4,-0.7]; }
  else if(air){ const k=P.vy<0?1:0.6; fn=[-1.0*k,-0.35]; ff=[-0.8*k,-0.2]; bn=[0.9*k,0.45]; bf=[0.75*k,0.35]; }
  else {
    const a=0.75*run;
    fn=[gal(0)*a, Math.max(0,-Math.cos(ph))*1.1*run];
    ff=[gal(0.7)*a, Math.max(0,-Math.cos(ph+0.7))*1.1*run];
    bn=[-gal(0.4)*a, -Math.max(0,Math.cos(ph+0.4))*1.0*run];
    bf=[-gal(1.1)*a, -Math.max(0,Math.cos(ph+1.1))*1.0*run];
  }
  const legP=(px,py,ang,len1,len2)=>c2=>{ c2.save(); c2.translate(px,py); c2.rotate(ang[0]); c2.beginPath(); c2.roundRect(-6,-6,12,len1+8,6); c2.translate(0,len1); c2.rotate(ang[1]); c2.roundRect(-5,-3,10,len2+3,5); c2.ellipse(2.5,len2,7.5,4.2,0,0,TAU); c2.restore(); };
  const ellP=(x,y,rx,ry,rot=0)=>c2=>{ c2.beginPath(); c2.ellipse(x,y,rx,ry,rot,0,TAU); };
  const tail=c2=>{ c2.save(); c2.translate(-40,-50); c2.rotate(wag); c2.beginPath(); c2.moveTo(2,4); c2.quadraticCurveTo(-20,-6,-14,-36); c2.quadraticCurveTo(-12,-40,-8,-36); c2.quadraticCurveTo(-10,-12,6,-4); c2.closePath(); c2.restore(); };
  const neck=c2=>{ c2.beginPath(); c2.moveTo(10,-56); c2.lineTo(26,-80); c2.lineTo(42,-72); c2.lineTo(32,-34); c2.closePath(); };
  const earShape=(px,py,ang,s)=>c2=>{ c2.save(); c2.translate(px,py); c2.rotate(ang); c2.scale(s,s); c2.beginPath(); c2.moveTo(-5,0); c2.bezierCurveTo(6,-3,12,4,11,14); c2.bezierCurveTo(10,26,6,32,0,32); c2.bezierCurveTo(-7,32,-9,22,-8,12); c2.bezierCurveTo(-7,5,-8,2,-5,0); c2.closePath(); c2.restore(); };
  const ea=P.earA||0.15;
  const parts=[
    [SH,tail],
    [SH,legP(-26,-38,bf,18,18)], [SH,legP(24,-40,ff,19,19)],
    [SH,earShape(40,-86,ea*0.85+0.1,0.75)],
    [F,ellP(-6,-46,34,14)], [F,ellP(22,-44,15,17)], [F,ellP(-30,-42,14,15)],
    [F,legP(-33,-38,bn,18,18)], [F,legP(17,-40,fn,19,19)],
    [F,neck], [F,ellP(36,-77,15.5,13.5)], [F,ellP(50,-69,12.5,9)],
  ];
  c.lineJoin='round';
  for(const [,fnc] of parts){ fnc(c); c.lineWidth=5; c.strokeStyle=OL; c.stroke(); }
  for(const [col,fnc] of parts){ fnc(c); c.fillStyle=col; c.fill(); }
  ell(c,-8,-56,22,3.2,LI); ell(c,34,-86,7,2.4,LI,-0.2); ell(c,-32,-50,7,3,LI,0.5);
  ell(c,20,-34,9,6,'#523020');
  line(c,21,-62,33,-46,OL,9); line(c,21,-62,33,-46,'#d4a017',6); ell(c,34,-42,3.2,3.2,OL); ell(c,34,-42,2.4,2.4,'#c0c6cc');
  ell(c,60,-72,5,4.2,OL); ell(c,60,-72,4.2,3.5,'#6a443a'); ell(c,61.2,-73,1.3,1,'#a07a70');
  c.fillStyle='#2a120c'; c.beginPath(); c.moveTo(41,-65); c.quadraticCurveTo(50,-57,59,-66); c.quadraticCurveTo(52,-62,41,-65); c.fill();
  const tl=P.fuss?10+Math.sin(t*8)*1.5:5+(run>0.3||air?Math.sin(t*30)*1.5+2:0);
  ell(c,52,-60+tl*0.2,3.8,tl,OL); ell(c,52,-60.5+tl*0.2,3,tl-0.7,'#e88a9a'); line(c,52,-63,52,-58+tl*0.4,'#c96a7a',1);
  line(c,35,-86,44,-83,SH,1.6);
  if(P.fuss){ c.strokeStyle=OL; c.lineWidth=2.2; c.beginPath(); c.arc(41,-77,3.5,Math.PI*1.1,Math.PI*1.9); c.stroke(); }
  else if((t%4.2)<0.13){ line(c,38,-79,44,-79,OL,2); }
  else { ell(c,41,-79,3.3,3.1,OL); ell(c,41,-79,2.6,2.4,'#e09a3a'); ell(c,41.4,-79,1.3,1.4,'#1a0e07'); ell(c,42,-79.8,.6,.6,'#fff'); }
  const ear=earShape(30,-88,ea,1);
  ear(c); c.lineWidth=4; c.strokeStyle=OL; c.stroke(); ear(c); c.fillStyle=SH; c.fill();
  c.restore();
}

function drawCat(c,x,y,t,leap){
  c.save(); c.translate(x,y);
  const grey='#80808a', dk='#5d5d66';
  if(leap){
    ell(c,0,-12,18,6,grey); ell(c,16,-16,7,6,grey);
    line(c,-16,-12,-30,-20,grey,4);
    c.fillStyle=grey; c.beginPath(); c.moveTo(13,-21); c.lineTo(15,-28); c.lineTo(18,-21); c.fill(); c.beginPath(); c.moveTo(18,-21); c.lineTo(21,-28); c.lineTo(23,-20); c.fill();
    ell(c,19,-17,1.5,1.5,'#f1c40f');
  } else {
    const br=Math.sin(t*2)*0.6;
    ell(c,0,-9,17,9+br,grey); ell(c,-3,-12,8,3,dk);
    ell(c,12,-12,8,7,grey);
    c.fillStyle=grey; c.beginPath(); c.moveTo(7,-17); c.lineTo(9,-25); c.lineTo(13,-18); c.fill(); c.beginPath(); c.moveTo(13,-18); c.lineTo(17,-25); c.lineTo(19,-15); c.fill();
    line(c,10,-12,13,-12,'#333',1.5); line(c,15,-12,18,-12,'#333',1.5);
    c.strokeStyle=grey; c.lineWidth=4; c.beginPath(); c.arc(-4,-3,15,Math.PI*0.1,Math.PI*0.85); c.stroke();
    c.fillStyle='rgba(255,255,255,.8)'; c.font='bold 12px '+FONT; c.fillText('z',22,-26-(t*8%10));
  }
  c.restore();
}

function drawBall(c,b,t){
  const y=b.y+Math.sin(t*3+b.x)*3;
  ell(c,b.x,y,10,10,'#d4e157');
  c.strokeStyle='#fff'; c.lineWidth=2;
  c.beginPath(); c.arc(b.x-9,y,8,-0.9,0.9); c.stroke();
  c.beginPath(); c.arc(b.x+9,y,8,Math.PI-0.9,Math.PI+0.9); c.stroke();
}

/* ---------------- Audio ---------------- */
let ac=null, muted=false;
function initAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); }
function tone(f1,f2,dur,type='square',vol=0.06,delay=0){
  if(!ac||muted) return;
  const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
const sfx={
  jump:()=>tone(320,620,0.11,'square',0.04),
  dj:()=>tone(500,1100,0.16,'triangle',0.07),
  land:()=>tone(150,60,0.09,'sine',0.12),
  ball:()=>{tone(880,880,0.07,'triangle',0.08); tone(1320,1320,0.12,'triangle',0.08,0.07);},
  combo:n=>tone(380+n*35,760+n*60,0.12,'square',0.04),
  boing:()=>tone(140,620,0.25,'sine',0.12),
  woof:()=>{tone(280,120,0.12,'sawtooth',0.07); tone(260,110,0.14,'sawtooth',0.07,0.17);},
  hiss:()=>tone(2400,1400,0.3,'sawtooth',0.025),
  thud:()=>tone(90,40,0.18,'sine',0.18),
  splash:()=>{tone(1200,300,0.2,'triangle',0.05); tone(900,200,0.25,'sine',0.05,0.05);},
  end:()=>{tone(523,523,0.15,'triangle',0.08); tone(392,392,0.15,'triangle',0.08,0.16); tone(262,262,0.35,'triangle',0.08,0.32);},
};

const cam={x:0,y:0}, shake={x:0,y:0};
let best=0; try{ best=+localStorage.getItem('zoomiesBest')||0; }catch(e){}

function reset(){
  Object.assign(P,{x:780,y:940,w:70,h:60,vx:0,vy:0,onGround:true,ground:solids[0],facing:1,jumps:1,coyote:0,buffer:0,
    wall:0,wallT:0,drop:0,lock:0,pound:false,bounce:false,peak:940,spinT:0,fuss:false,fussT:0});
  score=0; chain=new Set(); chainList=[]; flopped=new Set(); visited=new Set();

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function overlap(a,s){ return a.x<s.x+s.w && a.x+a.w>s.x && a.y<s.y+s.h && a.y+a.h>s.y; }

function addScore(n){ score+=n; }
function pop(text,col='#fff',size=20){ pops.push({x:P.x+P.w/2,y:P.y-10-pops.filter(p=>p.life>0.8).length*22,text,col,size,life:1.2}); }
function setBanner(text,col='#f7c873'){ banner={text,col,t:1.4}; }
function dust(x,y,n,col='rgba(235,225,205,'){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*260,vy:-Math.random()*140,life:0.5+Math.random()*0.3,max:0.8,r:3+Math.random()*4,col}); }

/* ---------------- Gameplay ---------------- */
function onLand(s,impact){
  const fall=P.y-P.peak; P.peak=P.y;
  P.squash=Math.min(0.28,impact/3800); P.earV=(P.earV||0)-impact/120;
  const wasPound=P.pound; P.pound=false; P.bounce=false; P.spinT=0;
  if(impact>450){ dust(P.x+P.w/2,P.y+P.h,impact>1000?12:5); sfx.land(); }
  if(s.solid||s.floor){
    if(chain.size>=3){ setBanner(`x${chain.size} combo. FLOOR!`,'#ff7f6e'); }
    chain.clear(); chainList=[]; flopped.clear();
    if(wasPound){ shakeAmt=7; sfx.thud(); }
    return;
  }
  paw(hctx,P.x+16,s.y+5); paw(hctx,P.x+54,s.y+7);
  if(!chain.has(s.name)){
    chain.add(s.name); chainList.push(s.name);
    const n=chain.size, pts=100*n; addScore(pts);
    pop(`${s.name} +${pts}`,'#fff');
    sfx.combo(n);
    if(n>=3 && n%1===0) setBanner(`x${n} COMBO`);
    if(!visited.has(s.name)){ visited.add(s.name); addScore(50); pop('New spot! +50','#9be7ff',16); }
  }
  if(fall>320){ addScore(150); pop('BIG DROP +150','#ffd36e'); }
  if(wasPound){
    if(s.soft){
      if(!flopped.has(s.name)){ flopped.add(s.name); addScore(300); pop('BELLY FLOP! +300','#ff9ad5',24); }
      P.vy=-900; P.onGround=false; P.bounce=true; P.jumps=1; sfx.boing(); dust(P.x+P.w/2,P.y+P.h,8,'rgba(255,255,255,');
    } else if(s.name==='Bath'){
      if(!flopped.has('Bath')){ flopped.add('Bath'); addScore(250); pop('SPLOSH! +250','#7fd3ff',24); }
      sfx.splash(); for(let i=0;i<16;i++) parts.push({x:P.x+P.w/2,y:P.y+P.h,vx:(Math.random()-.5)*400,vy:-200-Math.random()*300,life:.7,max:.7,r:3,col:'rgba(110,190,255,',g:1});
    } else { shakeAmt=6; addScore(50); pop('THUD +50','#ddd'); sfx.thud(); }
  }
  if(!cat.leap && s.name===cat.spot.name && Math.abs(P.x+P.w/2-cat.x)<60){
    addScore(500); setBanner('CAT EVICTED! +500','#ff9ad5'); sfx.hiss(); setTimeout(sfx.woof,250);
    const opts=catSpots.filter(c=>c!==cat.spot), to=opts[(Math.random()*opts.length)|0];
    cat.leap={fx:cat.x,fy:cat.y,tx:to.x,ty:to.y,t:0,to};
  }
}

function physics(dt){
  const L=keys.a||keys.arrowleft, R=keys.d||keys.arrowright;
  const dir=(R?1:0)-(L?1:0);
  const jumpHeld=keys[' ']||keys.w||keys.arrowup;
  if(dir && P.lock<=0) P.facing=dir;
  P.buffer-=dt; P.coyote-=dt; P.wallT-=dt; P.drop-=dt; P.lock-=dt;
  if(P.spinT>0) P.spinT=Math.max(0,P.spinT-dt);

  if(!P.pound && P.lock<=0){
    const acc=P.onGround?3200:2000, target=dir*RUN;
    if(P.vx<target) P.vx=Math.min(target,P.vx+acc*dt); else P.vx=Math.max(target,P.vx-acc*dt);
  }

  if(P.buffer>0){
    if(P.onGround||P.coyote>0){
      P.vy=-JUMP; P.onGround=false; P.coyote=0; P.buffer=0; P.jumps=1; P.peak=P.y; P.squash=-0.14; sfx.jump(); dust(P.x+P.w/2,P.y+P.h,4);
    } else if(P.wallT>0){
      P.vy=-800; P.vx=-P.wall*440; P.facing=-P.wall; P.wallT=0; P.buffer=0; P.jumps=1; P.lock=0.18; P.pound=false;
      addScore(75); pop('WALL KICK +75','#9bffb0'); sfx.jump(); dust(P.x+(P.wall>0?P.w:0),P.y+P.h/2,5);
    } else if(P.jumps>0 && !P.pound){
      P.vy=-DJUMP; P.jumps=0; P.buffer=0; P.spinT=0.42; addScore(25); pop('FLIP +25','#c9b6ff',16); sfx.dj();
    }
  }

  if(!jumpHeld && P.vy<0 && !P.bounce) P.vy+=GRAV*1.5*dt;
  P.vy+=GRAV*dt;
  P.vy=Math.min(P.vy,P.pound?1500:1250);
  if(P.wallT>0 && !P.onGround && P.vy>180 && dir===P.wall && !P.pound) P.vy=180;

  // horizontal
  P.x+=P.vx*dt;
  for(const s of solids) if(overlap(P,s)){
    if(P.vx>0){ P.x=s.x-P.w; if(!P.onGround){P.wall=1;P.wallT=0.15;} }
    else if(P.vx<0){ P.x=s.x+s.w; if(!P.onGround){P.wall=-1;P.wallT=0.15;} }
    P.vx=0;
  }
  // step up (stairs, low edges). Hold S to slip underneath instead.
  if(P.onGround && !(keys.s||keys.arrowdown) && P.vx!==0){
    const b=P.y+P.h;
    for(const p of plats) if(p.y<b-0.5 && p.y>=b-32 && P.x+P.w>p.x+6 && P.x<p.x+p.w-6){ P.y=p.y-P.h; P.ground=p; P.peak=P.y; break; }
  }

  // vertical
  const prevB=P.y+P.h, wasG=P.onGround;
  P.y+=P.vy*dt; P.onGround=false;
  let landed=null;
  for(const s of solids) if(overlap(P,s)){
    if(P.vy>=0 && prevB<=s.y+1){ P.y=s.y-P.h; landed=s; }
    else if(P.vy<0){ P.y=s.y+s.h; P.vy=0; }
  }
  if(!landed && P.vy>=0 && P.drop<=0){
    const b=P.y+P.h; let bestP=null;
    for(const p of plats) if(prevB<=p.y+0.5 && b>=p.y && P.x+P.w>p.x+2 && P.x<p.x+p.w-2){ if(!bestP||p.y<bestP.y) bestP=p; }
    if(bestP){ P.y=bestP.y-P.h; landed=bestP; }
  }
  if(landed){
    const impact=P.vy;
    P.onGround=true; P.ground=landed; P.vy=0; P.jumps=1;
    if(!wasG) onLand(landed,impact);
  } else if(wasG && P.vy>=0){ P.coyote=0.1; }
  if(!P.onGround) P.peak=Math.min(P.peak,P.y);
}

function update(dt){
  playT+=dt;
  timeLeft-=dt;
  if(timeLeft<=0){ timeLeft=0; startArrival(); return; }
  const onSofa=P.onGround && P.ground && P.ground.name==='Sofa';
  if(P.fuss){
    if(pressed[' ']||pressed.w||pressed.arrowup||pressed.a||pressed.d||pressed.arrowleft||pressed.arrowright||pressed.s||pressed.arrowdown||pressed.f){ P.fuss=false; P.squash=-0.1; }
    else {
      P.vx=0; P.fussT+=dt;
      if(P.fussT>0.6){ P.fussT=0; addScore(25); pop('belly rub +25','#ff9ad5',16); }
      if(Math.random()<dt*6) parts.push({x:P.x+P.w/2+(Math.random()-.5)*60,y:P.y,vx:(Math.random()-.5)*40,vy:-60-Math.random()*60,life:1.2,max:1.2,r:0,heart:1,col:'rgba(255,110,150,'});
      for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; if(!p.heart) p.vy+=200*dt; p.life-=dt; } parts=parts.filter(p=>p.life>0);
      for(const p of pops){ p.y-=50*dt; p.life-=dt; } pops=pops.filter(p=>p.life>0);
      if(banner){ banner.t-=dt; if(banner.t<=0) banner=null; }
      const k=Math.min(1,dt*5); cam.x+=(clamp(P.x+P.w/2-VW/2,0,WW-VW)-cam.x)*k; cam.y+=(clamp(P.y-VH*(IS_TOUCH?0.45:0.55),0,WH-VH)-cam.y)*k;
      return;
    }
  } else if(onSofa && pressed.f){
    P.fuss=true; P.fussT=0; P.vx=0; setBanner('FUSS UP MODE!','#ff9ad5'); sfx.woof(); tone(600,900,0.2,'sine',0.06,0.3);
    return;
  }
  if(pressed[' ']||pressed.w||pressed.arrowup) P.buffer=0.13;
  if(pressed.s||pressed.arrowdown){
    if(P.onGround){
      if(P.ground && !P.ground.solid){ P.drop=0.22; P.onGround=false; P.y+=1; P.coyote=0; }
    } else if(!P.pound){ P.pound=true; P.vy=1300; P.vx*=0.25; P.spinT=0; tone(900,200,0.15,'sawtooth',0.03); }
  }
  const steps=Math.ceil(dt/(1/240)), sdt=dt/steps;
  for(let i=0;i<steps;i++) physics(sdt);

  // balls
  const cx=P.x+P.w/2, cy=P.y+P.h/2;
  for(const b of balls) if(!b.got && Math.hypot(b.x-cx,b.y-cy)<46){
    b.got=true; gotCount++; addScore(250); pop('Ball! +250','#d4e157',22); sfx.ball();
    if(balls.every(b=>b.got)){ addScore(2000); setBanner('ALL THE BALLS! GOOD BOY LUDO +2000','#d4e157'); sfx.woof(); balls.forEach(b=>b.got=false); }
  }
  // cat leap
  if(cat.leap){
    const l=cat.leap; l.t+=dt/0.9;
    const k=Math.min(1,l.t);
    cat.x=l.fx+(l.tx-l.fx)*k; cat.y=l.fy+(l.ty-l.fy)*k-Math.sin(k*Math.PI)*180;
    if(k>=1){ cat.spot=l.to; cat.x=l.tx; cat.y=l.ty; cat.leap=null; }
  }
  // particles + popups
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g?1400:200)*dt; p.vx*=0.96; p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){ p.y-=50*dt; p.life-=dt; }
  pops=pops.filter(p=>p.life>0);
  if(banner){ banner.t-=dt; if(banner.t<=0) banner=null; }
  shakeAmt=Math.max(0,shakeAmt-dt*30);
  shake.x=(Math.random()-.5)*shakeAmt; shake.y=(Math.random()-.5)*shakeAmt;
  // camera
  const k=Math.min(1,dt*5);
  cam.x+=(clamp(P.x+P.w/2-VW/2+P.facing*110,0,WW-VW)-cam.x)*k;
  cam.y+=(clamp(P.y-VH*(IS_TOUCH?0.45:0.55),0,WH-VH)-cam.y)*k;
}

/* ---------------- The humans ---------------- */
let humans=[], arriveT=0;
function startArrival(){
  state='arrive'; arriveT=0;
  const fussing=P.fuss;
  if(!fussing){ dust(P.x+P.w/2,P.y+P.h/2,14);
  Object.assign(P,{x:588,y:985-P.h,vx:0,vy:0,onGround:true,ground:plats.find(p=>p.name==="Ludo's bed"),facing:-1,pound:false,spinT:0,bounce:false});
  dust(P.x+P.w/2,P.y+P.h,10); }
  humans=[
    {type:'niall',x:-70,tx:470,delay:0.0,ph:0,line:"Wasn't me.",lt:4.4},
    {type:'mum',  x:-70,tx:340,delay:0.45,ph:0,line:'LUDO!!',lt:1.8},
    {type:'dad',  x:-70,tx:210,delay:0.9,ph:0,line:'Has he been on the sofa again?',lt:3.1},
  ];
  if(fussing){ humans[1].line='Aww, who wants belly rubs?'; humans[2].line='Is he on the sofa AGAIN?'; humans[0].line='Can I have a go?'; }
  setBanner('THE HUMANS ARE HOME!','#ff9a7a');
  tone(660,660,0.12,'triangle',0.08); tone(520,520,0.25,'triangle',0.08,0.14); // doorbell-ish
  setTimeout(()=>sfx.woof(),600);
}
function updateArrive(dt){
  arriveT+=dt;
  for(const h of humans){
    if(arriveT>h.delay && h.x<h.tx){ h.x=Math.min(h.tx,h.x+(h.type==='niall'?260:200)*dt); h.ph+=dt*10; }
  }
  const k=Math.min(1,dt*3);
  cam.x+=(0-cam.x)*k; cam.y+=((WH-VH)-cam.y)*k;
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=200*dt; p.life-=dt; } parts=parts.filter(p=>p.life>0);
  for(const p of pops){ p.y-=50*dt; p.life-=dt; } pops=pops.filter(p=>p.life>0);
  if(banner){ banner.t-=dt; if(banner.t<=0) banner=null; }
  if(arriveT>6.4) endGame();
}
function drawHuman(c,h){
  const OL='#1a0f09', SK='#f0c3a4';
  const walking=h.x<h.tx-0.5 && arriveT>h.delay;
  const s=h.type==='niall'?0.84:1;
  const sw=walking?Math.sin(h.ph)*0.4:0, bob=walking?-Math.abs(Math.sin(h.ph))*3:0;
  const tee={dad:'#3d2a22',mum:'#161616',niall:'#2f6b4a'}[h.type];
  const jeans={dad:'#2f3b52',mum:'#1f1f24',niall:'#3a4660'}[h.type];
  const sh=(fn,col,lw=3)=>{ fn(); c.fillStyle=col; c.fill(); c.lineWidth=lw; c.strokeStyle=OL; c.stroke(); };
  c.save(); c.translate(h.x,1000); c.scale(s,s); c.lineJoin='round';
  // legs
  for(const [lx,a] of [[-11,sw],[11,-sw]]){
    c.save(); c.translate(lx,-84); c.rotate(a);
    sh(()=>{c.beginPath(); c.roundRect(-9,0,18,80,6);},jeans);
    sh(()=>{c.beginPath(); c.roundRect(-10,74,24,10,5);},'#222');
    c.restore();
  }
  c.translate(0,bob);
  // arms (behind torso edges)
  const arm=(ax,a,bag)=>{ c.save(); c.translate(ax,-146); c.rotate(a);
    sh(()=>{c.beginPath(); c.roundRect(-7,0,14,62,6);},SK);
    sh(()=>{c.beginPath(); c.roundRect(-8,-2,16,24,6);},tee);
    if(bag){ sh(()=>{c.beginPath(); c.roundRect(-14,56,28,34,5);},'#eef3f8'); rect(c,-14,66,28,6,'#2f63b5'); line(c,-6,56,-3,48,OL,2); line(c,6,56,3,48,OL,2); }
    c.restore(); };
  arm(-30,0.12-sw*0.8,h.type==='dad'); arm(30,-0.12+sw*0.8,h.type==='dad'||h.type==='mum');
  // torso
  sh(()=>{c.beginPath(); c.roundRect(-30,-152,60,74,14);},tee);
  if(h.type==='niall') sh(()=>{c.beginPath(); c.ellipse(0,-151,11,4,0,0,Math.PI);},'#f4f4f0',2);
  // neck + head
  rect(c,-7,-162,14,12,SK);
  if(h.type==='mum') sh(()=>{c.beginPath(); c.ellipse(0,-168,31,34,0,0,TAU); c.ellipse(-26,-140,10,10,0,0,TAU); c.ellipse(26,-140,10,10,0,0,TAU);},'#6b4430');
  sh(()=>{c.beginPath(); c.ellipse(0,-178,21,24,0,0,TAU);},SK);
  const eyeY=-180;
  if(h.type==='dad'){
    sh(()=>{c.beginPath(); c.moveTo(-21,-176); c.quadraticCurveTo(-22,-150,0,-153); c.quadraticCurveTo(22,-150,21,-176); c.quadraticCurveTo(12,-160,0,-161); c.quadraticCurveTo(-12,-160,-21,-176); c.closePath();},'#a07a4c',2);
    sh(()=>{c.beginPath(); c.ellipse(0,-196,21,11,0,Math.PI,TAU); c.lineTo(21,-193); c.lineTo(-21,-193); c.closePath();},'#b88d55',2);
    for(const x of [-12,-4,4,12]){ c.fillStyle='#b88d55'; c.beginPath(); c.moveTo(x-5,-204); c.lineTo(x+1,-214); c.lineTo(x+5,-204); c.fill(); }
    ell(c,-7,eyeY,3.2,3.6,'#fff'); ell(c,7,eyeY,3.2,3.6,'#fff'); ell(c,-7,eyeY,1.8,1.8,'#3b6fa8'); ell(c,7,eyeY,1.8,1.8,'#3b6fa8');
    line(c,-12,eyeY-8,-3,eyeY-10,'#8a6a40',2.5); line(c,12,eyeY-8,3,eyeY-10,'#8a6a40',2.5);
    ell(c,0,-171,3,4,'#e3a98a'); c.strokeStyle='#c8ccd2'; c.lineWidth=1.5; c.beginPath(); c.arc(2.5,-167.5,2.4,0,TAU); c.stroke();
    ell(c,0,-160,4,3,'#c9776a'); ell(c,-9,-163,4,3,'#f4cbb0'); ell(c,9,-163,4,3,'#f4cbb0');
  } else if(h.type==='mum'){
    sh(()=>{c.beginPath(); c.ellipse(-4,-196,23,12,0.15,Math.PI*0.95,TAU*1.02);},'#6b4430',2);
    ell(c,-7,eyeY,1.8,1.8,'#3b6fa8'); ell(c,7,eyeY,1.8,1.8,'#3b6fa8');
    c.strokeStyle='#7a1f2b'; c.lineWidth=3.2; c.beginPath(); c.roundRect(-16,eyeY-7,13,12,4); c.roundRect(3,eyeY-7,13,12,4); c.stroke(); line(c,-3,eyeY-2,3,eyeY-2,'#7a1f2b',2.5);
    ell(c,0,-169,2.5,3,'#e3a98a');
    ell(c,0,-160,4,5.5,'#5a1f1f');
  } else {
    sh(()=>{c.beginPath(); c.ellipse(0,-194,24,15,0,Math.PI*0.9,TAU*1.05);},'#5a3a22',2);
    for(const [x,y] of [[-14,-186],[-6,-184],[3,-185],[12,-187]]){ c.fillStyle='#5a3a22'; c.beginPath(); c.moveTo(x-6,y-8); c.lineTo(x,y+4); c.lineTo(x+6,y-8); c.fill(); }
    rr(c,-18,eyeY-6,16,11,4,'#111'); rr(c,2,eyeY-6,16,11,4,'#111'); line(c,-2,eyeY-2,2,eyeY-2,'#111',2.5);
    line(c,-12,eyeY-4,-8,eyeY-4,'rgba(255,255,255,.35)',2);
    ell(c,0,-169,2.5,3,'#e3a98a'); line(c,-5,-160,5,-161,'#7a3a2a',2.5);
  }
  c.restore();
  if(state==='arrive' && arriveT>h.lt && arriveT<h.lt+1.5 && !walking){
    c.font='800 20px '+FONT; const w=c.measureText(h.line).width+28;
    const bx=h.x-w/2, byy=1000-(h.type==='niall'?0.84:1)*215-70;
    rr(c,bx,byy,w,42,12,'#fff'); c.strokeStyle=OL; c.lineWidth=3; c.beginPath(); c.roundRect(bx,byy,w,42,12); c.stroke();
    c.fillStyle='#fff'; c.beginPath(); c.moveTo(h.x-8,byy+40); c.lineTo(h.x+2,byy+58); c.lineTo(h.x+10,byy+40); c.fill();
    line(c,h.x-8,byy+42,h.x+2,byy+58,OL,3); line(c,h.x+2,byy+58,h.x+10,byy+42,OL,3);
    c.fillStyle='#1a0f09'; c.textAlign='center'; c.fillText(h.line,h.x,byy+28); c.textAlign='left';
  }
}
function drawDoor(c){
  if(state!=='arrive' && state!=='over') return;
  const g=c.createLinearGradient(0,0,180,0); g.addColorStop(0,'rgba(255,240,190,.55)'); g.addColorStop(1,'rgba(255,240,190,0)');
  c.fillStyle=g; c.beginPath(); c.moveTo(20,820); c.lineTo(200,1000); c.lineTo(20,1000); c.fill();
  rect(c,0,820,20,180,'#fff3c4');
}

function endGame(){
  state='over'; overT=0; sfx.end();
  if(score>best){ best=score; try{ localStorage.setItem('zoomiesBest',String(best)); }catch(e){} }
}

/* ---------------- Render ---------------- */
function txt(s,x,y,size,col,align='left',weight='800'){
  ctx.font=`${weight} ${size}px ${FONT}`; ctx.textAlign=align;
  ctx.lineWidth=Math.max(3,size/6); ctx.strokeStyle='rgba(20,14,30,.85)'; ctx.lineJoin='round';
  ctx.strokeText(s,x,y); ctx.fillStyle=col; ctx.fillText(s,x,y);
}

function render(){
  const sx=Math.round(clamp(cam.x,0,WW-VW)), sy=Math.round(clamp(cam.y,0,WH-VH));
  ctx.fillStyle='#17151f'; ctx.fillRect(0,0,VW,VH);
  ctx.save(); ctx.translate(shake.x,shake.y);
  ctx.drawImage(house,sx,sy,VW,VH,0,0,VW,VH);
  ctx.translate(-sx,-sy);
  for(const b of balls) if(!b.got) drawBall(ctx,b,T);
  drawCat(ctx,cat.x,cat.y,T,!!cat.leap);
  for(const p of parts){ ctx.fillStyle=p.col+Math.max(0,p.life/p.max).toFixed(2)+')';
    if(p.heart){ ctx.font='bold 22px '+FONT; ctx.textAlign='center'; ctx.fillText('\u2665',p.x,p.y); ctx.textAlign='left'; }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); } }
  if(state==='play' && !P.fuss && P.onGround && P.ground && P.ground.name==='Sofa' && Math.floor(T*2.5)%3!==0)
    txt(IS_TOUCH?'Tap FUSS for fuss-up mode':'Press F for FUSS UP MODE',P.x+P.w/2,P.y-50,18,'#ff9ad5','center');
  if(P.fuss && state==='play') txt(IS_TOUCH?'Any button to get up':'Any key to get up',P.x+P.w/2,P.y-60,15,'#fff','center','700');
  drawDoor(ctx);
  drawDog(ctx,T);
  if(state==='arrive'||state==='over') for(const h of humans) drawHuman(ctx,h);
  for(const p of pops){ ctx.globalAlpha=Math.min(1,p.life*2); txt(p.text,p.x,p.y,p.size,p.col,'center'); }
  ctx.globalAlpha=1;
  ctx.restore();

  if(state!=='title') hud();
  if(state==='title') titleScreen();
  if(state==='over') overScreen();
}

function hud(){
  rr(ctx,16,16,330,128,14,'rgba(20,16,30,.75)');
  txt(score.toLocaleString('en-GB'),32,54,32,'#fff');
  txt(`Combo x${chain.size}`,32,82,18,chain.size>=3?'#f7c873':'#d8d0c0');
  txt(`Balls ${balls.filter(b=>b.got).length}/${balls.length}`,180,82,18,'#d4e157');
  txt(`Spots found ${visited.size}/${SPOT_NAMES.length}`,32,106,15,'#9be7ff','left','600');
  const tail=chainList.slice(-3).join(' > ');
  txt(tail||'Stay off the floor!',32,130,13,'#bbb','left','600');

  const t=Math.ceil(timeLeft), mm=Math.floor(t/60), ss=String(t%60).padStart(2,'0');
  rr(ctx,VW-236,16,220,76,14,'rgba(20,16,30,.75)');
  txt("Humans back in",VW-126,42,15,'#d8d0c0','center','600');
  txt(`${mm}:${ss}`,VW-126,80,34,timeLeft<10?'#ff6b6b':'#fff','center');
  if(timeLeft<10 && Math.floor(T*3)%2===0) txt("CAR IN THE DRIVE!",VW/2,VH-40,30,'#ff6b6b','center');
  if(banner){ const s=1+Math.max(0,banner.t-1.2)*2; ctx.save(); ctx.translate(VW/2,150); ctx.scale(s,s); ctx.globalAlpha=Math.min(1,banner.t*2); txt(banner.text,0,0,40,banner.col,'center'); ctx.restore(); ctx.globalAlpha=1; }
  if(playT<9){
    ctx.globalAlpha=Math.min(1,(9-playT)/1.5);
    rr(ctx,VW/2-420,VH-74,840,48,12,'rgba(20,16,30,.75)');
    if(IS_TOUCH) txt('Tap JUMP again mid-air to flip  ·  Down to drop through or belly flop  ·  kick off walls',VW/2,VH-43,16,'#fff','center','600'); else txt('A/D or arrows run  ·  W/Up/Space jump (again mid-air to flip)  ·  S/Down drop or belly flop  ·  kick off walls',VW/2,VH-43,16,'#fff','center','600');
    ctx.globalAlpha=1;
  }
  if(!IS_TOUCH) txt(muted?'M: sound off':'M: mute',VW-20,VH-14,12,'rgba(255,255,255,.6)','right','600');
}

function panel(h,top=VH/2-h/2,dim=true){ if(dim){ ctx.fillStyle='rgba(15,10,25,.55)'; ctx.fillRect(0,0,VW,VH); } rr(ctx,VW/2-380,top,760,h,22,'rgba(30,22,40,.92)'); }
function titleScreen(){
  panel(470);
  const y0=VH/2-235;
  txt('ZOOMIES',VW/2,y0+80,72,'#f7c873','center');
  txt('Ludo and the Floor Is Lava',VW/2,y0+118,28,'#fff','center','700');
  const lines=[
    "The humans have popped to Tesco. You have two minutes, Ludo.",
    'Parkour round the whole house without touching the floor.',
    'Each new bit of furniture in a run scores more. Touching the floor resets the combo.',
    'Find the tennis balls, belly flop onto soft things, and evict next door\'s cat.',
    (IS_TOUCH?'Hold Down':'Hold S or Down')+' to sneak under the stairs. Drop through the landing into the hall.',
  ];
  lines.forEach((l,i)=>txt(l,VW/2,y0+170+i*30,17,'#e8e0d0','center','600'));
  txt(IS_TOUCH?'Arrows run  ·  JUMP (tap again to flip)  ·  Down to drop/belly flop':'A/D or arrows run  ·  W/Up/Space jump  ·  S/Down drop or belly flop',VW/2,y0+340,18,'#9be7ff','center','700');
  if(Math.floor(T*2)%2===0) txt(IS_TOUCH?'Tap to start':'Press SPACE to start',VW/2,y0+400,26,'#fff','center');
  if(best) txt(`Best: ${best.toLocaleString('en-GB')}`,VW/2,y0+446,16,'#d4e157','center','600');
}
function overScreen(){
  panel(380,24,false);
  const y0=24;
  txt('BUSTED',VW/2,y0+70,54,'#ff9a7a','center');
  txt(score.toLocaleString('en-GB'),VW/2,y0+140,56,'#fff','center');
  txt(score>=best&&score>0?'New best!':`Best: ${best.toLocaleString('en-GB')}`,VW/2,y0+175,18,'#d4e157','center','700');
  const msg = score<1500 ? "She didn't notice a thing. Good boy, Ludo... ish."
    : score<5000 ? "Muddy paw prints on the sofa. Someone's in trouble."
    : score<12000 ? "There's a ball in the bath and Henry's been knocked over."
    : "Absolute carnage. Ludo, you're getting a bath.";
  txt(msg,VW/2,y0+225,20,'#e8e0d0','center','600');
  txt(`Spots found ${visited.size}/${SPOT_NAMES.length}   ·   Balls ${gotCount}`,VW/2,y0+262,16,'#9be7ff','center','600');
  if(overT>1 && Math.floor(T*2)%2===0) txt(IS_TOUCH?'Tap to go again':'Press SPACE to go again',VW/2,y0+340,24,'#fff','center');
}

/* ---------------- Loop + input ---------------- */
function idle(dt){
  const steps=Math.ceil(dt/(1/240));
  for(let i=0;i<steps;i++){ P.vy+=GRAV*dt/steps; P.vx*=0.9; physicsLite(dt/steps); }
}
function physicsLite(dt){
  const prevB=P.y+P.h; P.y+=P.vy*dt;
  for(const s of solids) if(overlap(P,s) && P.vy>=0 && prevB<=s.y+1){ P.y=s.y-P.h; P.vy=0; P.onGround=true; }
  for(const p of plats) if(prevB<=p.y+0.5 && P.y+P.h>=p.y && P.x+P.w>p.x && P.x<p.x+p.w){ P.y=p.y-P.h; P.vy=0; P.onGround=true; }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  animDog(dt);
  if(state==='play') update(dt);
  else if(state==='arrive') updateArrive(dt);
  else {
    idle(dt);
    if(state==='over') overT+=dt;
    if(pressed[' ']||pressed.enter){
      if(state==='title' || overT>1){ initAudio(); if(state==='over') reset(); state='play'; sfx.woof(); }
    }
  }
  render();
  if(IS_TOUCH){ const show=state==='play' && !P.fuss && P.onGround && P.ground && P.ground.name==='Sofa'; const tF=document.getElementById('tF'); if(tF.style.display!==(show?'flex':'none')) tF.style.display=show?'flex':'none'; }
  pressed={};
  requestAnimationFrame(frame);
}

const GAME_KEYS=[' ','w','a','s','d','f','arrowup','arrowdown','arrowleft','arrowright','enter','m'];
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(GAME_KEYS.includes(k)) e.preventDefault();
  if(!e.repeat) pressed[k]=true;
  keys[k]=true;
  if(k==='m'&&!e.repeat) muted=!muted;
  initAudio();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });


const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
document.querySelectorAll('.tb').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{ e.preventDefault(); initAudio(); if(!keys[k]) pressed[k]=true; keys[k]=true; b.classList.add('on'); try{b.setPointerCapture(e.pointerId);}catch(_){} };
  const up=e=>{ e.preventDefault(); keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
cv.addEventListener('pointerdown',e=>{ initAudio(); if(state!=='play'){ pressed[' ']=true; } });
document.addEventListener('gesturestart',e=>e.preventDefault());

reset();
requestAnimationFrame(frame);
})();
</script>
